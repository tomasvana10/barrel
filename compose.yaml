name: barrel

x-hc: &hc
  interval: 5s
  timeout: 5s
  start_period: 30s
  retries: 3

services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - 127.0.0.1:${QBITTORRENT_PORT}:8085
      - 127.0.0.1:${PROWLARR_PORT}:9696
      - 127.0.0.1:${RADARR_PORT}:7878
      - 127.0.0.1:${SONARR_PORT}:8989
      - 127.0.0.1:${LIDARR_PORT}:8686
      - 127.0.0.1:${BAZARR_PORT}:6767
      - 127.0.0.1:${TORRENT_LISTEN_PORT}:6881
      - 127.0.0.1:${TORRENT_LISTEN_PORT}:6881/udp
    volumes:
      - ./gluetun:/gluetun
    environment:
      - FIREWALL_OUTBOUND_SUBNETS=${FIREWALL_OUTBOUND_SUBNETS}
      - VPN_IPV6=${VPN_IPV6}
      - FIREWALL_VPN_INPUT_PORTS=${TORRENT_LISTEN_PORT}
      - SERVER_CATEGORIES=${SERVER_CATEGORIES}
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER}
      - VPN_TYPE=${VPN_TYPE}
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - SERVER_COUNTRIES=${SERVER_COUNTRIES}
      - TZ=${TZ}
      - UPDATER_PERIOD=${UPDATER_PERIOD}
      - DNS_SERVER=on
      - DNS_UPSTREAM_PLAIN_ADDRESSES=1.1.1.1:53
    healthcheck:
      <<: *hc
      test: wget -q -O /dev/null http://localhost:9999 || exit 1
    restart: ${RESTART_POLICY}

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    deploy:
      resources:
        limits:
          memory: 1g
    network_mode: "service:gluetun"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=8085
    volumes:
      - ./qbittorrent:/config
      - ${DOWNLOADS_PATH}:/downloads
    healthcheck:
      <<: *hc
      test: curl -f http://localhost:8085 || exit 1
    depends_on:
      gluetun:
        condition: service_healthy
    restart: ${RESTART_POLICY}

  aurral:
    image: ghcr.io/lklynet/aurral:latest
    container_name: aurral
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - DOWNLOAD_FOLDER=${DOWNLOADS_PATH}/tmp
      - CONTACT_EMAIL=${MUSICBRAINZ_CONTACT_EMAIL}
      - NODE_OPTIONS=--dns-result-order=ipv4first
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    volumes:
      - ./aurral:/app/backend/data
      - ${DOWNLOADS_PATH}/tmp:/app/downloads
    ports:
      - 127.0.0.1:${AURRAL_PORT}:3001
    depends_on:
      lidarr:
        condition: service_healthy
    restart: ${RESTART_POLICY}

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    network_mode: "service:gluetun"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./radarr:/config
      - ${DOWNLOADS_PATH}:/downloads
    healthcheck:
      <<: *hc
      test: curl -f http://localhost:7878/ping || exit 1
    depends_on:
      gluetun:
        condition: service_healthy
      qbittorrent:
        condition: service_healthy
    restart: ${RESTART_POLICY}

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    network_mode: "service:gluetun"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./sonarr:/config
      - ${DOWNLOADS_PATH}:/downloads
    healthcheck:
      <<: *hc
      test: curl -f http://localhost:8989/ping || exit 1
    depends_on:
      gluetun:
        condition: service_healthy
      qbittorrent:
        condition: service_healthy
    restart: ${RESTART_POLICY}

  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./jellyfin:/config
      - ${DOWNLOADS_PATH}/movies:/media/movies
      - ${DOWNLOADS_PATH}/tv:/media/tv
      - ${DOWNLOADS_PATH}/music:/media/music
    ports:
      - ${JELLYFIN_PORT}:8096
    healthcheck:
      <<: *hc
      test: curl -f http://localhost:8096/health || exit 1
    restart: ${RESTART_POLICY}
    devices:
      - /dev/dri:/dev/dri

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    network_mode: "service:gluetun"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./prowlarr:/config
    depends_on:
      gluetun:
        condition: service_healthy
    restart: ${RESTART_POLICY}

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - TZ=${TZ}
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    restart: ${RESTART_POLICY}

  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    container_name: seerr
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ}
      - PORT=5055
    ports:
      - ${SEERR_PORT}:5055
    volumes:
      - ./seerr:/app/config
    depends_on:
      jellyfin:
        condition: service_healthy
      radarr:
        condition: service_healthy
      sonarr:
        condition: service_healthy
    restart: ${RESTART_POLICY}

  cleanuparr:
    image: ghcr.io/cleanuparr/cleanuparr:latest
    container_name: cleanuparr
    ports:
      - 127.0.0.1:${CLEANUPARR_PORT}:11011
    volumes:
      - ./cleanuparr:/config
      - ${DOWNLOADS_PATH}:/downloads
    environment:
      - PORT=11011
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    depends_on:
      radarr:
        condition: service_healthy
      sonarr:
        condition: service_healthy
      qbittorrent:
        condition: service_healthy
    restart: ${RESTART_POLICY}

  headscale:
    image: headscale/headscale:latest
    container_name: headscale
    command: serve
    volumes:
      - ./headscale/config:/etc/headscale
      - ./headscale/lib:/var/lib/headscale
      - ./headscale/run:/var/run/headscale
      - /etc/letsencrypt:/etc/letsencrypt:ro
    ports:
      - ${HEADSCALE_PORT}:443
    restart: ${RESTART_POLICY}

  ts-subnet:
    image: tailscale/tailscale:latest
    container_name: ts-subnet
    hostname: mediaserver
    network_mode: host
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_AUTH_ONCE=true
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_ACCEPT_DNS=true
      - TS_ROUTES=192.168.1.0/24
      - TS_EXTRA_ARGS=--login-server=https://${HEADSCALE_DOMAIN}:${HEADSCALE_PORT}
    volumes:
      - ./ts-subnet:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
    depends_on:
      headscale:
        condition: service_started
    restart: ${RESTART_POLICY}

  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    network_mode: "service:gluetun"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./lidarr:/config
      - ${DOWNLOADS_PATH}:/downloads
    healthcheck:
      <<: *hc
      test: curl -f http://localhost:8686/ping || exit 1
    depends_on:
      gluetun:
        condition: service_healthy
      qbittorrent:
        condition: service_healthy
    restart: ${RESTART_POLICY}

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    network_mode: "service:gluetun"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./bazarr:/config
      - ${DOWNLOADS_PATH}:/downloads
    depends_on:
      gluetun:
        condition: service_healthy
      radarr:
        condition: service_healthy
      sonarr:
        condition: service_healthy
    restart: ${RESTART_POLICY}

  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    environment:
      - ND_SCANSCHEDULE=1h
      - ND_LOGLEVEL=info
      - ND_SCANNER_PURGEMISSING=always
    volumes:
      - ./navidrome:/data
      - ${DOWNLOADS_PATH}/music:/music:ro
      - /mnt/hdd:/mnt/hdd:ro
    ports:
      - ${NAVIDROME_PORT}:4533
    restart: ${RESTART_POLICY}
