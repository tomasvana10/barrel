server_url: https://headscale.yourdomain.com:8096
listen_addr: 0.0.0.0:443
metrics_listen_addr: 0.0.0.0:9090

tls_cert_path: /etc/letsencrypt/live/headscale.yourdomain.com/fullchain.pem
tls_key_path: /etc/letsencrypt/live/headscale.yourdomain.com/privkey.pem

noise:
  private_key_path: /var/lib/headscale/noise_private.key

prefixes:
  v4: 100.64.0.0/10
  v6: fd7a:115c:a1e0::/48
  allocation: sequential

database:
  type: sqlite
  sqlite:
    path: /var/lib/headscale/db.sqlite

policy:
  path: /etc/headscale/acl.json
  mode: file

dns:
  magic_dns: true
  base_domain: tail.tomasvana.dev
  nameservers:
    global:
      - 1.1.1.1
      - 1.0.0.1

derp:
  urls:
    - https://controlplane.tailscale.com/derpmap/default
  auto_update_enabled: true
  update_frequency: 3h

log:
  level: info
